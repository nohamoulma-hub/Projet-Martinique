# Configuration nginx : sert les fichiers statiques et relaie les appels API au backend.
# Tout passe par la même origine, ce qui évite toute configuration CORS côté backend
# et permet de garder API_URL vide dans le JavaScript.

server {
    listen 80;
    server_name localhost;

    # Sans cette directive, nginx envoie "Content-Type: text/html" sans charset :
    # le navigateur retombe sur un encodage ancien et les accents s'affichent mal
    # (i devient A-tilde). L'en-tete HTTP fait autorite sur la balise meta du HTML.
    charset utf-8;
    charset_types text/css text/javascript application/javascript application/json;

    root /usr/share/nginx/html;
    # Le projet n'a pas d'index.html : la page d'accueil est accueil.html.
    index accueil.html;

    # Compression des fichiers texte. Les images sont déjà compressées,
    # les recompresser coûterait du CPU sans rien gagner.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;

    # Fichiers de build présents dans le dossier monté : ils ne doivent pas être servis.
    location ~ ^/(Dockerfile|nginx\.conf|\.dockerignore) {
        deny all;
    }

    # Appels API relayés au backend. Les préfixes correspondent aux routeurs FastAPI.
    # À regrouper sous /api/ plus tard pour n'avoir qu'une seule règle ici.
    # Le (/|$) final est indispensable : sans lui, /meteo.html et /auth.html
    # correspondent aux prefixes /meteo et /auth et sont relayes au backend, qui
    # repond {"detail":"Not Found"} au lieu de laisser nginx servir la page.
    location ~ ^/(health|activites|auth|utilisateurs|projets|meteo|docs|redoc|openapi\.json)(/|$) {
        # 127.0.0.11 est le DNS interne de Docker. Sans resolver explicite, nginx
        # résout "backend" une seule fois au démarrage et renvoie des 502 si le
        # conteneur backend redémarre avec une autre IP. Passer par une variable
        # force une nouvelle résolution toutes les 10 secondes.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_url http://backend:8000;
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Photos des activités : servies directement par nginx, avec mise en cache longue.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Tout le reste est un fichier statique du site.
    location / {
        try_files $uri $uri/ =404;
    }
}
