# Orchestration des trois conteneurs du projet.
# Lancer avec : docker compose up --build
#
# Les trois services partagent un réseau créé automatiquement par Docker, dans lequel
# chacun joint les autres par son nom de service (db, backend, frontend). Aucune IP
# n'est codée en dur.

name: projet-martinique

services:

  db:
    image: postgres:18-alpine
    container_name: martinique-db
    environment:
      POSTGRES_USER: martinique
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-martinique}
      POSTGRES_DB: martinique
    volumes:
      # Volume nommé : les données survivent à la destruction du conteneur.
      # C'est ce qui permet de reconstruire l'image sans perdre la base.
      #
      # Le montage se fait sur /var/lib/postgresql et non /var/lib/postgresql/data :
      # depuis PostgreSQL 18, l'image place les données dans un sous-dossier versionné
      # (18/docker) pour permettre un pg_upgrade --link sans franchir de point de montage.
      # L'ancienne convention fait échouer le démarrage avec un message explicite.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # PostgreSQL accepte des connexions quelques secondes après le démarrage du
      # conteneur. Sans ce test, le backend tenterait de migrer trop tôt et échouerait.
      test: ["CMD-SHELL", "pg_isready -U martinique -d martinique"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: martinique-backend
    environment:
      # "db" est résolu par le DNS interne de Docker vers le conteneur PostgreSQL.
      DATABASE_URL: postgresql://martinique:${POSTGRES_PASSWORD:-martinique}@db:5432/martinique
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?definir JWT_SECRET_KEY dans le fichier .env}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Le code est monté depuis l'hôte : une modification est prise en compte
      # immédiatement grâce au --reload, sans reconstruire l'image.
      - ./backend:/app
    # Les migrations sont appliquées au démarrage, puis le serveur se lance.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    # Exposé uniquement pour le débogage direct de l'API. Le frontend n'en a pas
    # besoin : il passe par nginx, qui joint le backend via le réseau interne.
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: martinique-frontend
    depends_on:
      - backend
    volumes:
      # Monté en lecture seule : nginx n'a aucune raison d'écrire dans le site.
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
